name: CI - Testes de API

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:

# Necessario para o passo de publicacao empurrar o branch gh-pages.
# Repositorios criados a partir de 2023 recebem GITHUB_TOKEN somente
# leitura por padrao, e sem esta declaracao o push do relatorio falha
# com 403.
permissions:
  contents: write

jobs:
  testes-api:
    runs-on: ubuntu-latest

    # A suite roda contra uma instancia propria, iniciada do zero a cada
    # execucao, e nao contra a serverest.dev publica.
    #
    # Duas razoes. A primeira e de etiqueta: a serverest.dev e mantida
    # gratuitamente pela comunidade, e disparar a suite inteira a cada
    # push e a cada pull request e consumir infraestrutura de terceiro
    # sem necessidade.
    #
    # A segunda e de confiabilidade, e importa mais: o ambiente publico
    # tem dados de outras pessoas e indisponibilidade eventual. Um build
    # vermelho por causa disso nao indica regressao nenhuma, e suite que
    # falha sem motivo real deixa de ser levada a serio -- na pratica,
    # desliga a verificacao. Com container, a falha volta a significar
    # que alguma coisa quebrou.
    services:
      serverest:
        image: paulogoncalvesbh/serverest:latest
        ports:
          - 3000:3000

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Aguardar a API responder
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/usuarios > /dev/null; then
              echo "API disponível"
              exit 0
            fi
            sleep 2
          done
          echo "API não respondeu no tempo esperado"
          exit 1

      - name: Executar a suíte de testes
        run: mvn -B test -Denv=local

      # O relatorio e gerado pelo allure-maven, ja declarado no pom, em
      # vez de por uma action de terceiro. A anterior
      # (simple-elf/allure-report-action) e uma action Docker cuja
      # imagem base, openjdk:8-jre-alpine, foi removida do Docker Hub
      # quando as imagens oficiais openjdk foram descontinuadas. Como o
      # GitHub constroi actions Docker na fase de setup, a falha
      # derrubava o job inteiro antes do checkout -- os testes nem
      # chegavam a rodar.
      - name: Gerar relatório Allure
        if: always()
        run: mvn -B allure:report

      - name: Publicar resultados como artefato
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: target/allure-results
          retention-days: 15

      - name: Publicar relatório no GitHub Pages
        if: always() && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: target/site/allure-maven-plugin
